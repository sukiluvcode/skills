[tool.poetry]
name = "sisyphus"
version = "0.2.0"
description = "Automated literature extraction framework for scientific papers"
authors = ["soike lab <luvsoike@icloud.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = ">=3.10,<3.13"
python-dotenv = "^1.0.1"
tqdm = "^4.66.2"
pandas = "^2.2.2"
numpy = "^1.26.4"

# LLM / extraction stack
openai = "^1.17.1"
tiktoken = "^0.7.0"
langchain = "^0.3.2"
langchain-openai = "^0.2.2"
langchain-community = "^0.3.1"
langchain-chroma = "^0.1.4"
chromadb = "^0.4.24"
dspy = "^2.5.22"

# Document loading
pypdf = "*"
bs4 = "^0.0.2"
html5lib = ">=1.1,<2.0"
nltk = "^3.8.1"

# Storage
sqlmodel = "^0.0.18"
aiosqlite = "^0.20.0"
aiofiles = "^23.2.1"

# Crawler (optional — only needed if downloading papers)
playwright = "^1.43.0"

# Utilities
pydantic = "^2.0"
retry = "^0.9.2"
faiss-cpu = "^1.8.0"
scikit-learn = "^1.4.2"

[tool.poetry.group.dev.dependencies]
ipykernel = "^6.29.4"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
