[project]
name = "sisyphus"
version = "0.2.0"
description = "Two-stage label→extract pipeline for structured data mining from scientific papers"
authors = [{ name = "soike lab", email = "luvsoike@icloud.com" }]
readme = "README.md"
requires-python = ">=3.10,<3.14"

dependencies = [
    "python-dotenv>=1.0.1",
    "tqdm>=4.66.2",
    "pandas>=2.2.2",
    "numpy>=1.26.4",

    # LLM / extraction stack
    "openai>=1.17.1",
    "tiktoken>=0.7.0",
    "langchain>=0.3.2",
    "langchain-openai>=0.2.2",
    "langchain-community>=0.3.1",
    "langchain-chroma>=0.1.4",
    "chromadb>=0.4.24",
    "dspy>=2.5.22",

    # Document loading / parsing
    "pypdf",
    "bs4>=0.0.2",
    "html5lib>=1.1,<2.0",
    "nltk>=3.8.1",
    "regex>=2023.0.0",          # used verbatim by the vendored chempp parser (sisyphus/parse/_seqlb.py)

    # Storage
    "sqlmodel>=0.0.18",
    "aiosqlite>=0.20.0",
    "aiofiles>=23.2.1",

    # Utilities
    "pydantic>=2.0",
    "tenacity>=8.0",
    "scikit-learn>=1.4.2",
]

[project.optional-dependencies]
# Stage 1 (download): playwright drives per-publisher crawling; openpyxl reads
# .xlsx DOI lists. After install, also run `playwright install chromium`.
crawler = [
    "playwright>=1.43.0",
    "openpyxl>=3.1.5",
    "httpx>=0.27",
]
dev = [
    "ipykernel>=6.29.4",
]

[project.scripts]
sisyphus = "sisyphus.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "ipykernel>=6.29.4",
    "pytest>=8.0",
]
